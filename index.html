<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#0f1117" />
  <meta name="description" content="HaushaltsFinanz – Finanzverwaltung für Mehrpersonenhaushalte" />

  <!-- PWA Manifest -->
  <link rel="manifest" href="manifest.json" />

  <!-- iOS PWA: Vollbild, kein Safari-Chrome -->
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="HaushaltsFinanz" />
  <link rel="apple-touch-icon" href="assets/icons/icon-192.png" />

  <!-- iOS: Kein automatisches Telefon-Link-Erkennen -->
  <meta name="format-detection" content="telephone=no" />

  <!-- Verhindert Caching auf HTTP (wichtig für lokalen Server) -->
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
  <meta http-equiv="Pragma" content="no-cache" />
  <meta http-equiv="Expires" content="0" />

  <title>HaushaltsFinanz</title>

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;0,9..40,600;1,9..40,300&display=swap" rel="stylesheet" />

  <!-- Main Stylesheet -->
  <link rel="stylesheet" href="css/main.css" />
  <link rel="stylesheet" href="css/components.css" />
  <link rel="stylesheet" href="css/views.css" />
</head>
<body>

  <!-- App Root – alle Views werden hier dynamisch eingehängt -->
  <div id="app">
    <div id="loading-screen" class="loading-screen">
      <div class="loading-logo">
        <span class="logo-icon">⬡</span>
        <span class="logo-text">HaushaltsFinanz</span>
      </div>
      <div class="loading-spinner"></div>
    </div>
  </div>

  <!-- Toast-Benachrichtigungen -->
  <div id="toast-container" class="toast-container"></div>

  <!-- Modal Overlay -->
  <div id="modal-overlay" class="modal-overlay hidden"></div>
  <div id="modal-container" class="modal-container hidden"></div>

  <!-- Core: Datenbank & State zuerst laden -->
  <script src="js/core/db.js"></script>
  <script src="js/core/state.js"></script>
  <script src="js/core/router.js"></script>
  <script src="js/core/utils.js"></script>

  <!-- UI Komponenten -->
  <script src="js/components/toast.js"></script>
  <script src="js/components/modal.js"></script>
  <script src="js/components/chart.js"></script>
  <script src="js/components/navbar.js"></script>

  <!-- Views (Unterseiten) -->
  <script src="js/views/login.js"></script>
  <script src="js/views/setup.js"></script>
  <script src="js/views/dashboard.js"></script>
  <script src="js/views/accounts.js"></script>
  <script src="js/views/budget.js"></script>
  <script src="js/views/analytics.js"></script>
  <script src="js/views/settings.js"></script>
  <script src="js/views/transaction-form.js"></script>

  <!-- App Einstiegspunkt -->
  <script src="js/app.js"></script>

  <!-- Service Worker – wird in app.js registriert -->
  <script>
    // SW-Registrierung erfolgt in js/app.js
    // Hier nur ein simpler Fallback falls app.js noch nicht geladen hat
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('/sw.js').catch(err =>
          console.warn('[SW] Fallback-Registrierung fehlgeschlagen:', err)
        );
      });
    }
  </script>
</body>
</html>
